name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install netcat
        run: sudo apt-get update -q && sudo apt-get install -y -q netcat-openbsd
      - name: Build and test
        run: make CC=${{ matrix.cc }} test
      - name: Test with AddressSanitizer and UBSan
        run: make CC=${{ matrix.cc }} sanitize
